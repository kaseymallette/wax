<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wax Weekly</title>
  <meta name="description" content="Seven daily playlists across five genre stations, updated weekly by Wax Weekly." />
  <link rel="canonical" href="https://waxweekly.com/" />

  <!-- Social sharing / Open Graph -->
  <meta property="og:title" content="Wax Weekly" />
  <meta property="og:description" content="Seven daily playlists across five genre stations, updated weekly." />
  <meta property="og:url" content="https://waxweekly.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wax Weekly" />

  <!-- Fallback metadata for platforms that also read Twitter Card tags -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Wax Weekly" />
  <meta name="twitter:description" content="Seven daily playlists across five genre stations, updated weekly." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23241f1a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b3402a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e8ddc9'/%3E%3C/svg%3E" />
  <link href="https://api.fontshare.com/v2/css?f[]=gambetta@400,500,700&f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./base.css?v=20260816-1729" />
  <link rel="stylesheet" href="./style.css?v=20260816-1745" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="disc" width="36" height="36" viewBox="0 0 40 40" fill="none" aria-label="Wax logo">
            <circle cx="20" cy="20" r="18" fill="currentColor" opacity="0.92"/>
            <circle cx="20" cy="20" r="13.5" stroke="var(--color-bg)" stroke-width="0.75" opacity="0.5"/>
            <circle cx="20" cy="20" r="10.5" stroke="var(--color-bg)" stroke-width="0.75" opacity="0.5"/>
            <circle cx="20" cy="20" r="6.5" fill="var(--accent)"/>
            <circle cx="20" cy="20" r="1.6" fill="var(--color-bg)"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Wax</span>
          <span class="brand-sub">Weekly</span>
        </span>
      </div>
      <div class="header-meta">
        <span class="week-label" id="week-label"></span>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light mode"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="stations" aria-label="Genre stations">
      <div class="station-rail" id="station-rail" role="tablist" aria-label="Stations"></div>
    </section>

    <section class="week" aria-label="Daily playlists">
      <div class="week-head">
        <div class="week-title">
          <h1 id="station-title"></h1>
          <p class="week-desc" id="station-desc"></p>
        </div>
        <div class="day-rail" id="day-rail" role="tablist" aria-label="Day of week"></div>
      </div>

      <div class="playlist-panel" id="playlist-panel">
        <div class="playlist-head">
          <div class="playlist-title">
            <span class="playlist-eyebrow" id="playlist-eyebrow"></span>
            <h2 id="playlist-day"></h2>
            <a class="playlist-link" id="playlist-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .79.87 1.27 1.54.84l10.79-6.86a1 1 0 0 0 0-1.68L9.54 4.3C8.87 3.87 8 4.35 8 5.14z"/></svg>
              <span>Play playlist on Spotify</span>
            </a>
          </div>
          <dl class="playlist-stats">
            <div class="stat"><dt>Tracks</dt><dd id="stat-tracks">–</dd></div>
            <div class="stat"><dt>Avg BPM</dt><dd id="stat-bpm">–</dd></div>
            <div class="stat"><dt>Avg mood</dt><dd id="stat-mood">–</dd></div>
            <div class="stat"><dt>Avg energy</dt><dd id="stat-energy">–</dd></div>
            <div class="stat"><dt>Avg dance</dt><dd id="stat-dance">–</dd></div>
            <div class="stat"><dt>Avg valence</dt><dd id="stat-valence">–</dd></div>
          </dl>
        </div>

        <ol class="track-list" id="track-list" role="list"></ol>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Seven daily playlists per station, clustered by BPM and mood from the Currently Listening pool. Last updated on <span id="footer-week"></span>.</p>
  </footer>

  <script src="./data.js?v=20260816-1729"></script>
  <script src="./art.js?v=20260816-1729"></script>
  <script src="./app.js?v=20260816-1735" defer></script></body>
</html>
